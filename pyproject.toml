[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-ai-listing-agent"
version = "0.1.0"
description = "Claude or Gemini turns product photos and a rough note (or a CSV row) into a validated eBay listing, then lists it through the eBay Sell Inventory API (sandbox)."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "anthropic>=2.0",
  "google-genai>=1.0",
  "requests>=2.31",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.scripts]
ebay-lister = "ebay_lister.cli:main"

[tool.setuptools]
packages = ["ebay_lister"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]
